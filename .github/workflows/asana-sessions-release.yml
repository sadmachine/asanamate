name: asana-sessions-release
on:
  push:
    tags: ['asana-sessions/v*']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/asana-sessions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tags release only commits whose every asana-sessions-ci job passed on main.
      - name: Require asana-sessions-ci on this commit
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-ci.sh asana-sessions-ci.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check tag and asset versions
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("npm-shrinkwrap.json")); if (process.env.GITHUB_REF_NAME !== `asana-sessions/v${p.version}` || l.version !== p.version || l.packages[""].version !== p.version) process.exit(1)'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: scripts/check-pack.sh
      - name: Pack pinned release artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cp install.mjs dist/install.mjs
          cd dist
          sha256sum *.tgz install.mjs > checksums.txt
          sha256sum -c checksums.txt
      - name: Publish standalone assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/install.mjs dist/checksums.txt --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --latest=false
