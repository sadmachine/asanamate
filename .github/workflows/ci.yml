name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded pull request pushes stop; every main commit keeps its own run,
# since release tags require a successful run on their exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Builds the release archives without publishing and checks them; smoke runs
  # the binaries.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=before
        env:
          HOMEBREW_TAP_TOKEN: unused
      - name: Check archives
        working-directory: dist
        run: |
          sha256sum -c checksums.txt
          for os in darwin linux; do
            for arch in amd64 arm64; do
              tar -tzf "asanamate_${os}_${arch}.tar.gz" > files.txt
              grep -qx asanamate files.txt
              grep -qx asanamate-hrvst files.txt
              grep -qx asanamate-ccmux files.txt
              grep -qx README.md files.txt
              grep -qx docs/extensions.md files.txt
              grep -qx install-themes.sh files.txt
              for theme in ../themes/*.toml ../themes/LICENSE*; do
                grep -qx "themes/${theme##*/}" files.txt
              done
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/*.tar.gz

  smoke:
    needs: release-check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: asanamate_linux_amd64.tar.gz
          - os: ubuntu-24.04-arm
            archive: asanamate_linux_arm64.tar.gz
          - os: macos-latest
            archive: asanamate_darwin_arm64.tar.gz
          - os: macos-15-intel
            archive: asanamate_darwin_amd64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
      # A fresh home and a PATH without optional tools: the binary must still
      # start, and doctor must fail only because nothing is configured.
      - name: Run the binary on a bare system
        run: |
          tar -xzf "${{ matrix.archive }}" asanamate asanamate-hrvst asanamate-ccmux themes install-themes.sh
          export HOME="$(mktemp -d)" PATH=/usr/bin:/bin
          unset XDG_CONFIG_HOME XDG_STATE_HOME ASANA_ACCESS_TOKEN
          sh ./install-themes.sh
          test "$(find "$HOME/.config/asanamate/themes" -name '*.toml' | wc -l)" -eq "$(find themes -name '*.toml' | wc -l)"
          test "$(find "$HOME/.config/asanamate/themes" -name 'LICENSE*' | wc -l)" -eq "$(find themes -name 'LICENSE*' | wc -l)"
          ./asanamate version
          ./asanamate help > /dev/null
          ./asanamate-hrvst -h > /dev/null
          ./asanamate-ccmux help > /dev/null
          if ./asanamate doctor 2> err.txt; then echo "doctor passed without config"; exit 1; fi
          grep -q "run \`asanamate setup\`" err.txt
      # With a config but a bad token and no tools on PATH, doctor must report
      # the token as blocking and every missing tool as a warning.
      - name: Run doctor without optional tools
        run: |
          unset VISUAL EDITOR
          export HOME="$(mktemp -d)" XDG_CONFIG_HOME="$RUNNER_TEMP/alt-config" XDG_STATE_HOME="$RUNNER_TEMP/alt-state"
          mkdir -p "$XDG_CONFIG_HOME/asanamate" && echo 'workspace = "1"' > "$XDG_CONFIG_HOME/asanamate/config.toml"
          if ASANA_ACCESS_TOKEN=invalid PATH="$HOME/empty" ./asanamate doctor > out.txt; then echo "doctor passed with a bad token"; exit 1; fi
          cat out.txt
          grep -q '^asana  *error:' out.txt
          for tool in git editor browser; do grep -q "^$tool  *warning:" out.txt; done
