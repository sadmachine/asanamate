name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  actions: read
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Tags release only commits whose every ci job passed on main.
      - name: Require ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/require-ci.sh ci.yml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tag's what's-new and docs/migrations.md sections, if any, head the
      # release notes.
      - name: Release notes header
        id: notes
        run: |
          section() { awk -v tag="## $GITHUB_REF_NAME" '$0 == tag { on = 1; next } on && /^## / { exit } on' "$1"; }
          section internal/whatsnew/whats-new.md > "$RUNNER_TEMP/whatsnew.md"
          section docs/migrations.md > "$RUNNER_TEMP/notes.md"
          : > "$RUNNER_TEMP/header.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/whatsnew.md"; then
            { echo "## What's new"; cat "$RUNNER_TEMP/whatsnew.md"; } >> "$RUNNER_TEMP/header.md"
          fi
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            { echo '## Upgrading'; cat "$RUNNER_TEMP/notes.md"; } >> "$RUNNER_TEMP/header.md"
          fi
          if [ -s "$RUNNER_TEMP/header.md" ]; then
            echo "flags=--release-header=$RUNNER_TEMP/header.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean ${{ steps.notes.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
