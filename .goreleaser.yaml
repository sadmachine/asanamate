version: 2
project_name: asanamate

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/asanamate
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github

# The tap repository does not exist yet; the cask is built but not published.
# Remove skip_upload once sadmachine/homebrew-tap and HOMEBREW_TAP_TOKEN exist.
homebrew_casks:
  - name: asanamate
    skip_upload: true
    repository:
      owner: sadmachine
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sadmachine/asanamate
    description: Terminal UI for Asana tickets with scriptable actions
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/asanamate"]
          end
